<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>遮蔽会话记忆管理 — dsh-memory-core</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230ea5e9'/%3E%3Cpath d='M5 4h6v2H5zM5 8h6v2H5zM5 12h4v2H5z' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --border: #e3e6ea;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #2f6fed;
    --accent-weak: #e8f0fe;
    --danger: #d3384a;
    --danger-weak: #fdeef0;
    --ok: #1a7f4b;
    --ok-weak: #e6f5ec;
    --warn: #b26a00;
    --warn-weak: #fdf3e3;
    --radius: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1d23;
      --card: #23272f;
      --border: #3a3f4a;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #5b8def;
      --accent-weak: #1e2a45;
      --danger: #f06a7a;
      --danger-weak: #3a1f24;
      --ok: #4fc08d;
      --ok-weak: #1a3329;
      --warn: #d9903a;
      --warn-weak: #3a2e1a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 5;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .status-line { display: flex; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .chip {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 10px;
  }
  .chip.badge { background: var(--accent-weak); color: var(--accent); border-color: transparent; }
  .chip.ok { background: var(--ok-weak); color: var(--ok); border-color: transparent; }
  .chip.off { background: var(--danger-weak); color: var(--danger); border-color: transparent; }
  main { max-width: 1100px; margin: 20px auto; padding: 0 20px; }
  .layout { display: grid; grid-template-columns: 200px 1fr; gap: 16px; }
  @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } }
  nav.tabs {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 8px;
    align-self: start;
    position: sticky;
    top: 76px;
  }
  nav.tabs button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 9px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
    margin-bottom: 2px;
  }
  nav.tabs button:hover { background: var(--bg); }
  nav.tabs button.active { background: var(--accent-weak); color: var(--accent); font-weight: 600; }
  nav.tabs button .count { float: right; color: var(--muted); font-weight: 400; }
  section.panel { display: none; }
  section.panel.active { display: block; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 14px;
  }
  .card h3 { margin: 0 0 10px; font-size: 14px; font-weight: 600; }
  .card h3 .hint { font-weight: 400; font-size: 12px; color: var(--muted); margin-left: 6px; }
  .empty { color: var(--muted); font-size: 13px; padding: 8px 0; }
  .entry {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
    position: relative;
  }
  .entry pre {
    margin: 0 0 8px;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
  }
  .entry .date { font-size: 11px; color: var(--muted); margin-right: 8px; }
  .entry .actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .entry textarea {
    width: 100%;
    min-height: 64px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    font: 13px/1.5 inherit;
    resize: vertical;
  }
  button {
    font: 12px/1.4 inherit;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { opacity: .9; color: #fff; }
  button.danger { color: var(--danger); border-color: #f1c0c6; }
  button.danger:hover { background: var(--danger-weak); border-color: var(--danger); color: var(--danger); }
  button.ok { color: var(--ok); border-color: #b9dec8; }
  button.ok:hover { background: var(--ok-weak); border-color: var(--ok); color: var(--ok); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .add-row { display: flex; gap: 8px; margin-top: 4px; }
  .add-row input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font: 13px inherit;
  }
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #23272f;
    color: #fff;
    padding: 8px 16px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    transition: opacity .25s;
    pointer-events: none;
    z-index: 20;
    max-width: 80vw;
  }
  .toast.show { opacity: 1; }
  .pending-entry { border-left: 3px solid var(--warn); }
  .archived-entry { border-left: 3px solid var(--muted); opacity: .88; }
  .note { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .full-only { display: none; }
  body.full .full-only { display: initial; }
</style>
</head>
<body>
<header>
  <h1>遮蔽会话记忆管理</h1>
  <div class="status-line" id="status-line">
    <span class="chip" id="chip-enabled">加载中…</span>
    <span class="chip" id="chip-tracks">—</span>
    <span class="chip" id="chip-preset">preset: —</span>
    <span class="chip" id="chip-dir">—</span>
  </div>
</header>

<main>
  <div class="card" id="disabled-card" style="display:none">
    <h3>当前是纯遮蔽状态（无记忆）</h3>
    <p class="empty">本 preset 只遮蔽其他记忆插件，自己没有开记忆。三种状态：纯遮蔽（默认）/ 轻量记忆（三轨）/ 完整记忆（五轨）。</p>
    <p class="note">切到轻量或完整记忆：在插件设置里打开「记忆功能」（轻量默认 lite 三轨；想要五轨再设 memoryTracks: full），然后刷新本页。复制下面这句给 agent：<br>
    <code>请把 dsh-memory-core 切到「完整记忆」状态：memoryTracks=full，然后告诉我怎么用记忆管理面板。</code></p>
  </div>

  <div class="layout" id="layout" style="display:none">
    <nav class="tabs" id="tabs"></nav>
    <div id="content"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";
  const $ = (sel) => document.querySelector(sel);
  let state = { status: null, tracks: [], cache: {} };

  function toast(msg) {
    const el = $("#toast");
    el.textContent = msg;
    el.classList.add("show");
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove("show"), 2600);
  }

  async function api(url, opts) {
    const res = await fetch(url, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.ok === false) {
      throw new Error(data.message || ("请求失败 HTTP " + res.status));
    }
    return data;
  }

  function esc(s) {
    return String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  async function loadStatus() {
    const data = await api("/api/memory-core/status");
    state.status = data.data;
    state.tracks = data.data.tracks || [];
    renderStatus();
    if (data.data.memoryEnabled !== true) {
      $("#disabled-card").style.display = "";
      $("#layout").style.display = "none";
      return;
    }
    $("#disabled-card").style.display = "none";
    $("#layout").style.display = "";
    document.body.classList.toggle("full", data.data.memoryTracks === "full");
    renderTabs();
    await loadTrack(state.tracks[0]);
  }

  function renderStatus() {
    const s = state.status;
    const chipEnabled = $("#chip-enabled");
    if (s.memoryEnabled === true) {
      chipEnabled.textContent = s.memoryTracks === "full" ? "完整记忆（五轨）" : "轻量记忆（三轨）";
      chipEnabled.className = "chip ok";
    } else {
      chipEnabled.textContent = "纯遮蔽状态（无记忆）";
      chipEnabled.className = "chip off";
    }
    $("#chip-tracks").textContent = "tracks: " + (s.tracks || []).join(" / ");
    $("#chip-preset").textContent = "preset: " + s.presetName;
    $("#chip-dir").textContent = s.memoryDir || "";
  }

  function renderTabs() {
    const tabs = $("#tabs");
    tabs.innerHTML = "";
    const labels = {
      memory: "长期记忆", user: "用户档案", key: "关键事实",
      project: "项目记忆", daily: "每日日志",
    };
    for (const track of state.tracks) {
      const btn = document.createElement("button");
      btn.textContent = labels[track] || track;
      btn.dataset.track = track;
      btn.addEventListener("click", () => switchTrack(track));
      tabs.appendChild(btn);
    }
  }

  function setActiveTab(track) {
    for (const btn of document.querySelectorAll("#tabs button")) {
      btn.classList.toggle("active", btn.dataset.track === track);
    }
  }

  async function switchTrack(track) {
    setActiveTab(track);
    await loadTrack(track);
  }

  async function loadTrack(track) {
    const data = await api("/api/memory-core/entries?track=" + encodeURIComponent(track));
    state.cache[track] = data.data;
    renderTrack(track);
  }

  function renderTrack(track) {
    const d = state.cache[track];
    const content = $("#content");
    const labels = {
      memory: "长期记忆", user: "用户档案", key: "关键事实",
      project: "项目记忆", daily: "每日日志",
    };
    const html = [];
    html.push('<section class="panel active">');

    // 正式条目
    html.push('<div class="card"><h3>' + esc(labels[track] || track) + ' · 正式条目 <span class="hint">' + (d.entries || []).length + ' 条</span></h3>');
    if (!d.entries || d.entries.length === 0) {
      html.push('<div class="empty">暂无记忆条目。</div>');
    } else {
      for (let i = 0; i < d.entries.length; i++) {
        const entry = d.entries[i];
        const dateMatch = /^\[(\d{4}-\d{2}-\d{2})/.exec(entry);
        const date = dateMatch ? dateMatch[1] : "";
        html.push('<div class="entry" data-index="' + i + '">');
        html.push('<pre>' + (date ? '<span class="date">' + esc(date) + '</span>' : "") + esc(entry) + '</pre>');
        html.push('<div class="actions">');
        html.push('<button data-op="edit" data-track="' + esc(track) + '" data-index="' + i + '">编辑</button>');
        html.push('<button data-op="archive" data-track="' + esc(track) + '" data-index="' + i + '">归档</button>');
        html.push('<button data-op="delete" data-track="' + esc(track) + '" data-index="' + i + '" class="danger">删除</button>');
        html.push('</div></div>');
      }
    }
    html.push('</div>');

    // 待确认
    html.push('<div class="card"><h3>待确认 <span class="hint">' + (d.pending || []).length + ' 条 · 写入后需人工确认</span></h3>');
    if (!d.pending || d.pending.length === 0) {
      html.push('<div class="empty">暂无待确认记忆。</div>');
    } else {
      for (let i = 0; i < d.pending.length; i++) {
        const sug = d.pending[i];
        html.push('<div class="entry pending-entry">');
        html.push('<pre>' + esc(sug.entry ?? sug.content ?? "") + '</pre>');
        html.push('<div class="actions">');
        html.push('<button data-op="confirm" data-track="' + esc(track) + '" data-index="' + i + '" class="ok">允许并写入</button>');
        html.push('<button data-op="reject" data-track="' + esc(track) + '" data-index="' + i + '" class="danger">拒绝</button>');
        html.push('</div></div>');
      }
    }
    html.push('</div>');

    // 归档
    html.push('<div class="card"><h3>归档 <span class="hint">' + (d.archived || []).length + ' 条 · 不注入任何会话</span></h3>');
    if (!d.archived || d.archived.length === 0) {
      html.push('<div class="empty">暂无归档条目。</div>');
    } else {
      for (let i = 0; i < d.archived.length; i++) {
        const entry = d.archived[i];
        html.push('<div class="entry archived-entry">');
        html.push('<pre>' + esc(entry) + '</pre>');
        html.push('<div class="actions">');
        html.push('<button data-op="promote" data-track="' + esc(track) + '" data-index="' + i + '" class="ok">移回主轨</button>');
        html.push('<button data-op="removeArchive" data-track="' + esc(track) + '" data-index="' + i + '" class="danger">删除</button>');
        html.push('</div></div>');
      }
    }
    html.push('</div>');

    // 新增
    html.push('<div class="card"><h3>新增条目</h3>');
    html.push('<div class="add-row">');
    html.push('<input id="new-entry-input" placeholder="写一条 ' + esc(labels[track] || track) + ' 记忆…">');
    html.push('<button id="new-entry-btn" class="primary">写入</button>');
    html.push('</div></div>');

    html.push('</section>');
    content.innerHTML = html.join("");

    // 新增条目
    $("#new-entry-btn").addEventListener("click", async () => {
      const input = $("#new-entry-input");
      const contentText = input.value.trim();
      if (!contentText) { toast("内容为空"); return; }
      try {
        await api("/api/memory-core/entry", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "add", track, content: contentText }),
        });
        toast("已写入 " + (labels[track] || track));
        await loadTrack(track);
      } catch (e) { toast(e.message); }
    });
    $("#new-entry-input").addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") $("#new-entry-btn").click();
    });

    // 条目操作
    content.querySelectorAll("button[data-op]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const op = btn.dataset.op;
        const index = Number(btn.dataset.index);
        const body = { action: op, track };
        if (["edit"].includes(op)) {
          const entryDiv = btn.closest(".entry");
          const pre = entryDiv.querySelector("pre");
          const original = state.cache[track].entries[index];
          if (!original) return;
          const textarea = document.createElement("textarea");
          textarea.value = original;
          pre.replaceWith(textarea);
          btn.textContent = "保存";
          btn.dataset.op = "saveEdit";
          btn.dataset.index = index;
          btn.classList.add("primary");
          const cancelBtn = document.createElement("button");
          cancelBtn.textContent = "取消";
          cancelBtn.dataset.op = "cancelEdit";
          cancelBtn.dataset.index = index;
          btn.after(cancelBtn);
          return;
        }
        if (op === "saveEdit") {
          const entryDiv = btn.closest(".entry");
          const textarea = entryDiv.querySelector("textarea");
          body.entry = state.cache[track].entries[index];
          body.content = textarea.value;
          try {
            await api("/api/memory-core/entry", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body),
            });
            toast("已更新");
            await loadTrack(track);
          } catch (e) { toast(e.message); }
          return;
        }
        if (op === "cancelEdit") {
          await loadTrack(track);
          return;
        }
        const source =
          op === "delete" || op === "archive" ? state.cache[track].entries[index]
          : op === "confirm" || op === "reject" ? state.cache[track].pending[index].entry
          : op === "promote" || op === "removeArchive" ? state.cache[track].archived[index]
          : undefined;
        if (source === undefined) return;
        if (op === "delete" && !confirm("确认删除这条记忆？此操作不可撤销。")) return;
        body.entry = source;
        try {
          await api("/api/memory-core/entry", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const msg = { archive: "已归档", delete: "已删除", confirm: "已允许并写入", reject: "已拒绝", promote: "已移回主轨", removeArchive: "已从归档删除" };
          toast(msg[op] || "完成");
          await loadTrack(track);
        } catch (e) { toast(e.message); }
      });
    });
  }

  loadStatus().catch((e) => {
    toast("初始化失败：" + e.message);
    $("#status-line").innerHTML = '<span class="chip off">无法连接插件后端（/api/memory-core）</span>';
  });
})();
</script>
</body>
</html>
