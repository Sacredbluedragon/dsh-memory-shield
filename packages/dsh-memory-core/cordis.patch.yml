# dsh bundle patch: 插入本插件，但默认关闭。
# 本包一旦装进 profile 就会被所有会话加载（注册 memory_core 工具 + memory-core:snapshot 注入），
# 因此默认 disabled: true，只在目标 preset 里显式启用。
# 要用于某个 preset：在该 preset 的 plugins 里显式挂载本包，并去掉 disabled（或写 disabled: false）。
- insert:
    - id: memory-core
      name: 'dsh-memory-core'
      disabled: true
